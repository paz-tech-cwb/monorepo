name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Repo-wide lint currently fails on pre-existing debt unrelated to
      # most PRs. Until that debt is cleaned up, lint only files changed
      # in this PR so CI reflects the quality of new/modified code
      # without blocking on unrelated legacy violations.
      - name: Lint changed files
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'backend/*.ts' 'backend/**/*.ts')
          if [ -z "$FILES" ]; then
            echo "No changed backend TypeScript files; skipping lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$FILES"
          REL_FILES=$(echo "$FILES" | sed 's#^backend/##')
          cd backend
          npx eslint $REL_FILES

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
