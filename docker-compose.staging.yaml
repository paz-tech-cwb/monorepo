services:
  postgres:
    image: postgres:16
    container_name: church_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-church_staging}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-church_staging}
      POSTGRES_DB: ${DB_NAME:-church_staging}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-church_staging} -d ${DB_NAME:-church_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: church_staging_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-church_staging}
      DB_PASSWORD: ${DB_PASSWORD:-church_staging}
      DB_NAME: ${DB_NAME:-church_staging}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: ${DB_LOGGING:-true}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-staging_only_access_secret_change_me_32chars}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-staging_only_refresh_secret_change_me_32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-staging-client-id}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      PORT: 3001
      CORS_ORIGIN: http://localhost:${ADMIN_PORT:-3010}
    ports:
      - "${API_PORT:-3011}:3001"

  admin-ui:
    build:
      context: ./admin-ui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3011}/api
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-staging-local-fake-api-key}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-church-staging-local.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-church-staging-local}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-church-staging-local.appspot.com}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:000000000000:web:staginglocal}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-G-STAGINGLOCAL}
    container_name: church_staging_admin_ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-3010}:3000"

volumes:
  pgdata_staging:
