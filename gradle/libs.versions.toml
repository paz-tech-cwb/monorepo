[versions]
kotlin                  = "2.1.0"
agp                     = "8.7.3"
compose-bom             = "2025.04.00"
compose-navigation      = "2.8.9"
ktor                    = "3.1.3"
koin                    = "4.0.3"
datastore               = "1.1.2"
coroutines              = "1.10.1"
serialization           = "1.8.1"
datetime                = "0.6.2"
coil                    = "3.1.0"
firebase-bom            = "33.13.0"
turbine                 = "1.2.0"
junit                   = "4.13.2"
androidx-test-ext       = "1.2.1"

[libraries]
# Ktor
ktor-client-core            = { module = "io.ktor:ktor-client-core",                    version.ref = "ktor" }
ktor-client-cio             = { module = "io.ktor:ktor-client-cio",                     version.ref = "ktor" }
ktor-client-darwin          = { module = "io.ktor:ktor-client-darwin",                  version.ref = "ktor" }
ktor-client-content-neg     = { module = "io.ktor:ktor-client-content-negotiation",     version.ref = "ktor" }
ktor-client-auth            = { module = "io.ktor:ktor-client-auth",                    version.ref = "ktor" }
ktor-client-logging         = { module = "io.ktor:ktor-client-logging",                 version.ref = "ktor" }
ktor-client-mock            = { module = "io.ktor:ktor-client-mock",                    version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json",     version.ref = "ktor" }

# Koin
koin-core                   = { module = "io.insert-koin:koin-core",                    version.ref = "koin" }
koin-android                = { module = "io.insert-koin:koin-android",                 version.ref = "koin" }
koin-compose                = { module = "io.insert-koin:koin-androidx-compose",        version.ref = "koin" }
koin-test                   = { module = "io.insert-koin:koin-test",                    version.ref = "koin" }

# DataStore
datastore-preferences-core  = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
datastore-preferences       = { module = "androidx.datastore:datastore-preferences",    version.ref = "datastore" }

# Coroutines
coroutines-core             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }

# Serialization / DateTime
serialization-json          = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
datetime                    = { module = "org.jetbrains.kotlinx:kotlinx-datetime",            version.ref = "datetime" }

# Compose BOM + UI
compose-bom                 = { module = "androidx.compose:compose-bom",                version.ref = "compose-bom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3           = { module = "androidx.compose.material3:material3" }
compose-navigation          = { module = "androidx.navigation:navigation-compose",       version.ref = "compose-navigation" }
compose-activity            = { module = "androidx.activity:activity-compose",           version = "1.10.1" }
compose-lifecycle           = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.7" }
compose-viewmodel           = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.7" }

# Coil
coil-compose                = { module = "io.coil-kt.coil3:coil-compose",               version.ref = "coil" }
coil-network                = { module = "io.coil-kt.coil3:coil-network-ktor3",         version.ref = "coil" }

# Firebase (Android — platform SDKs only, not KMP)
firebase-bom                = { module = "com.google.firebase:firebase-bom",            version.ref = "firebase-bom" }
firebase-auth               = { module = "com.google.firebase:firebase-auth-ktx" }
firebase-messaging          = { module = "com.google.firebase:firebase-messaging-ktx" }
firebase-remote-config      = { module = "com.google.firebase:firebase-config-ktx" }
google-signin               = { module = "com.google.android.gms:play-services-auth",   version = "21.3.0" }

# Testing
turbine                     = { module = "app.cash.turbine:turbine",                    version.ref = "turbine" }
junit                       = { module = "junit:junit",                                 version.ref = "junit" }
kotlin-test                 = { module = "org.jetbrains.kotlin:kotlin-test",            version = "2.1.0" }
kotlin-test-junit           = { module = "org.jetbrains.kotlin:kotlin-test-junit",      version = "2.1.0" }
androidx-test-ext           = { module = "androidx.test.ext:junit",                     version.ref = "androidx-test-ext" }

[plugins]
kotlin-multiplatform        = { id = "org.jetbrains.kotlin.multiplatform",              version.ref = "kotlin" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",                    version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization",       version.ref = "kotlin" }
kotlin-compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose",             version.ref = "kotlin" }
android-application         = { id = "com.android.application",                         version.ref = "agp" }
android-library             = { id = "com.android.library",                             version.ref = "agp" }
ksp                         = { id = "com.google.devtools.ksp",                         version = "2.1.0-1.0.29" }
google-services             = { id = "com.google.gms.google-services",                  version = "4.4.2" }
