# SwiftLint configuration for PazChurch iOS
# https://github.com/realm/SwiftLint

included:
  - PazChurch

excluded:
  - PazChurch/Generated
  - build

# ── Rules ────────────────────────────────────────────────────────────────────

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - xct_specific_matcher
  - yoda_condition

disabled_rules:
  - trailing_whitespace          # handled by SwiftFormat
  - trailing_comma               # SwiftFormat enforces trailing commas; defer to it
  - multiple_closures_with_trailing_closure
  - todo                         # legitimate in-progress work items

# ── Rule configurations ───────────────────────────────────────────────────────

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: false

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 500
  error: 700

type_body_length:
  warning: 250
  error: 400

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - fg
    - bg
    - to
    - at
    - sx
    - sy

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

large_tuple:
  warning: 3
  error: 4

function_parameter_count:
  warning: 7
  error: 10
