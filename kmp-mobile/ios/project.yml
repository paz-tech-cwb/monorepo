name: PazChurch
options:
  bundleIdPrefix: com.cwb.pazchurch
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  FirebaseAuth:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "8.0.0"
  Pulse:
    url: https://github.com/kean/Pulse
    from: "5.1.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PazChurch:
    type: application
    platform: iOS
    sources:
      - path: PazChurch
        excludes:
          - "**/*.md"
    dependencies:
      # KMP shared framework — built by ./gradlew :shared:assembleSharedXCFramework
      - framework: ../shared/build/XCFrameworks/debug/Shared.xcframework
        embed: true
      # Firebase via SPM
      - package: FirebaseAuth
        product: FirebaseAuth
      - package: FirebaseAuth
        product: FirebaseMessaging
      - package: FirebaseAuth
        product: FirebaseStorage
      # Google Sign-In via SPM
      - package: GoogleSignIn
        product: GoogleSignIn
      # Kingfisher for image caching
      - package: Kingfisher
        product: Kingfisher
      # Pulse — in-app network inspector, gated behind DevToolsGate (see Account screen).
      # PulseProxy (NetworkLogger.enableProxy) is used instead of the Pulse target's own
      # URLSessionProxyDelegate.enableAutomaticRegistration (soft-deprecated since Pulse
      # 5.0) — see the comment in PazChurchApp.swift for why: automatic registration only
      # intercepts URLSession's delegate-based init, and Ktor's Darwin engine recreates its
      # internal NSURLSessionDataDelegate in a way that automatic registration's init-swizzle
      # doesn't reliably wrap, so `logDataTask(_:didReceive:)` (required for response bodies)
      # never fires — the request/response line shows in the inspector but bodies are always
      # empty. PulseProxy swizzles URLSessionTask.resume() and the private underlying
      # connection class directly, which is unaffected by how/where the session's delegate
      # was constructed.
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseUI
      - package: Pulse
        product: PulseProxy
    settings:
      base:
        INFOPLIST_FILE: PazChurch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.cwb.pazchurch.app.dev
          CODE_SIGN_ENTITLEMENTS: PazChurch/PazChurch.entitlements
          CODE_SIGN_IDENTITY: "iPhone Developer"
          DEVELOPMENT_TEAM: NMCA95DPCN
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.454955850434-hcge1g96aeh77ecesvrjk3ol35k23jl5
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.cwb.pazchurch.app
          CODE_SIGN_ENTITLEMENTS: PazChurch/PazChurch-Release.entitlements
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "iPhone Distribution"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: NMCA95DPCN
          PROVISIONING_PROFILE_SPECIFIER: "PazChurch AppStore Distribution"
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.139667803306-vbo7nbgufjpr464k2ko91gnbvodjo9v7
    capabilities:
      - pushNotifications
      - signInWithApple
    prebuildScripts:
      - name: Build KMP Shared Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:assembleSharedXCFramework
        basedOnDependencyAnalysis: false
    # Generate a shared, checked-in scheme (xcodegen rewrites the whole
    # .xcodeproj package on every `generate`, which otherwise silently
    # wipes out any manually-maintained xcshareddata/xcschemes — CI's
    # workflows build with `-scheme PazChurch` and don't run xcodegen).
    # Note: this also means xcodegen now owns the scheme's LastUpgradeVersion
    # attribute — a future `xcodegen generate` run may reset it again.
    scheme:
      testTargets: []
      gatherCoverageData: false
